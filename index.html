<!doctype html>
<html lang="en" id="root-html">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <script>
      // Set up RTL support for Arabic and Urdu
      const lang = localStorage.getItem("mooj_lang") || "en";
      const htmlEl = document.getElementById("root-html");
      if (lang === "ar" || lang === "ur") {
        htmlEl.setAttribute("dir", "rtl");
        htmlEl.setAttribute("lang", lang);
      } else {
        htmlEl.setAttribute("dir", "ltr");
      }
    </script>
    <!-- TODO: Set the document title to the name of your application -->
    <title>Moojyatra App</title>
    <meta name="description" content="Moojyatra Generated Project" />
    <meta name="author" content="Moojyatra" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Moojyatra App" />
    <meta property="og:description" content="Moojyatra Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://moojyatra.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Moojyatra" />
    <meta name="twitter:image" content="https://moojyatra.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
