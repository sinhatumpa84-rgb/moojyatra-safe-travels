<!doctype html>
<html lang="en" id="root-html">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <script>
      // Set up RTL support for Arabic and Urdu
      const lang = localStorage.getItem("mooj_lang") || "en";
      const htmlEl = document.getElementById("root-html");
      if (lang === "ar" || lang === "ur") {
        htmlEl.setAttribute("dir", "rtl");
        htmlEl.setAttribute("lang", lang);
      } else {
        htmlEl.setAttribute("dir", "ltr");
      }
    </script>
    <title>MoojYatra — Gamified AI Smart Travel Platform</title>
    <meta name="description" content="MoojYatra – Gamified AI Smart Travel Platform for Safe, Fair & Rewarding Travel across India." />
    <meta name="author" content="MoojYatra" />

    <meta property="og:title" content="MoojYatra — Gamified AI Smart Travel Platform" />
    <meta property="og:description" content="Explore India with AI travel assistance, fraud prevention, verified fair prices, and gamified travel quests." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Moojyatra" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
